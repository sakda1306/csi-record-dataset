<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>CSI Remote</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { padding: 12px 16px 28px; max-width: 560px; margin: 0 auto; overflow-x: hidden; }
  select, input { min-width: 0; }
  .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .top .grow { flex: 1; }
  .status { text-align: center; padding: 18px 12px; }
  .status .phase { color: var(--muted); font-size: 16px; }
  .status .title { font-size: 26px; font-weight: 800; margin: 4px 0; }
  .status .big { font-size: 72px; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .status .sub { color: var(--muted); }
  .status.ph-recording { box-shadow: inset 0 0 0 3px var(--bad); }
  .status.ph-countdown { box-shadow: inset 0 0 0 3px var(--warn); }
  section { margin-top: 12px; }
  label.h { display: block; font-size: 14px; color: var(--muted); margin: 12px 0 6px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .seg button { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); padding: 10px 14px; }
  .seg button.on { background: var(--info); color: #0b0d10; border-color: var(--info); }
  .acts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .act { background: var(--panel-2); color: var(--text); border: 2px solid var(--line); padding: 10px; text-align: left; border-radius: 12px; min-width: 0; overflow-wrap: anywhere; }
  .act.on { border-color: var(--info); background: #1d2a3a; }
  .act .n { font-weight: 700; }
  .act .c { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; margin-top: 4px; }
  .act.done .c b { color: var(--ok); }
  .stepper { display: flex; align-items: center; gap: 8px; }
  .stepper button { width: 46px; height: 46px; font-size: 24px; }
  .stepper input { width: 70px; text-align: center; font-size: 20px; }
  .big-btn { width: 100%; padding: 20px; font-size: 24px; font-weight: 800; margin-top: 14px; }
  .btn-col { display: grid; gap: 10px; margin-top: 12px; }
  .btn-col button { padding: 16px; font-size: 20px; font-weight: 700; }
  .res .v { font-size: 24px; font-weight: 800; }
  .res ul { margin: 6px 0 0; padding-left: 18px; }
  .log { font-family: Consolas, Menlo, monospace; font-size: 11px; color: var(--muted); white-space: pre-wrap; max-height: 160px; overflow: auto; }
  .flash .t { font-size: 34vw; line-height: 1; } .flash .s { font-size: 7vw; }
  details summary { color: var(--muted); cursor: pointer; }
  .w100 { width: 100%; }
</style>
</head>
<body>
<div class="top">
  <span class="chip" id="link"><span class="dot"></span><span>–</span></span>
  <span class="grow"></span>
  <span class="chip" id="conn">กำลังเชื่อมต่อ…</span>
</div>

<div class="panel status" id="status">
  <div class="phase" id="phase">–</div>
  <div class="title" id="title">–</div>
  <div class="big" id="big"></div>
  <div class="sub" id="sub"></div>
</div>

<div class="err" id="err" style="margin-top:8px"></div>

<!-- idle: choose and start -->
<section id="setup" hidden>
  <div class="panel">
    <label class="h">ผู้ทดลอง</label>
    <div class="row">
      <select id="vol" style="flex:1"></select>
      <input id="vol-new" placeholder="ชื่อใหม่ เช่น v06" style="flex:1" hidden>
    </div>
    <label class="h">ตำแหน่ง</label>
    <div class="row seg" id="pos"></div>
    <label class="h">ท่า</label>
    <div class="acts" id="acts"></div>
    <label class="h">จำนวนเทคต่อกัน</label>
    <div class="row" style="align-items:center;justify-content:space-between">
      <div class="stepper">
        <button class="btn-ghost" id="minus">−</button>
        <input id="reps" type="number" min="1" max="200" value="1" inputmode="numeric">
        <button class="btn-ghost" id="plus">+</button>
      </div>
      <div class="row seg" id="quick"></div>
    </div>
    <label class="h">หมายเหตุ (ไม่ใส่ก็ได้)</label>
    <input id="note" class="w100" maxlength="200" placeholder="เช่น ใส่รองเท้าแตะ, พื้นเปียก">
    <button class="big-btn btn-ok" id="start">เริ่มบันทึก</button>
  </div>
</section>

<!-- running -->
<section id="running" hidden>
  <button class="big-btn btn-bad" id="stop">หยุด</button>
</section>

<!-- review -->
<section id="review" hidden>
  <div class="btn-col">
    <button class="btn-ok" data-act="keep">เก็บเทคนี้</button>
    <button class="btn-warn" data-act="redo">ทิ้ง แล้วบันทึกใหม่</button>
    <button class="btn-bad" data-act="discard">ทิ้ง แล้วหยุด</button>
  </div>
</section>

<section class="panel res" id="result" hidden></section>

<section>
  <details><summary>บันทึกการทำงาน</summary><div class="log" id="log"></div></details>
</section>

<div class="flash" id="flash"><div class="t" id="flash-t"></div><div class="s" id="flash-s"></div></div>
<div class="overlay" id="pin-box" hidden>
  <div class="panel" style="width:min(360px,100%)">
    <div style="font-size:20px;font-weight:700;margin-bottom:10px">ใส่ PIN</div>
    <input id="pin" class="w100" inputmode="numeric" autocomplete="off" style="font-size:24px;text-align:center">
    <div class="err" id="pin-err"></div>
    <button class="big-btn btn-ok" id="pin-ok" style="margin-top:6px">ตกลง</button>
  </div>
</div>

<script src="/common.js"></script>
<script>
"use strict";
const sel = load() || {};
let lastPhase = null;

function load() { try { return JSON.parse(localStorage.getItem("csirec.sel")); } catch { return null; } }
function save() { try { localStorage.setItem("csirec.sel", JSON.stringify(sel)); } catch { /* private mode */ } }

function showErr(msg) {
  $("#err").textContent = msg || "";
  if (msg) setTimeout(() => { if ($("#err").textContent === msg) $("#err").textContent = ""; }, 4000);
}

async function send(action, args) {
  unlockAudio();
  try { await api(action, args); showErr(""); }
  catch (e) {
    if (e.status === 403) { askPin(e.message); return; }
    showErr(e.message);
  }
}

function askPin(msg) {
  $("#pin-err").textContent = msg || "";
  $("#pin").value = getPin();
  $("#pin-box").hidden = false;
  $("#pin").focus();
}
$("#pin-ok").onclick = () => { setPin($("#pin").value.trim()); $("#pin-box").hidden = true; unlockAudio(); };

// ------------------------------------------------------------------ setup form
function buildForm(st) {
  const vs = $("#vol");
  const cur = sel.volunteer || st.volunteers[0] || "";
  const opts = [...st.volunteers];
  if (cur && !opts.includes(cur)) opts.push(cur);
  const html = opts.map((v) => `<option ${v === cur ? "selected" : ""}>${esc(v)}</option>`).join("") +
    `<option value="__new">+ เพิ่มชื่อใหม่…</option>`;
  if (vs.dataset.html !== html) { vs.innerHTML = html; vs.dataset.html = html; }

  const pos = $("#pos");
  if (!pos.childElementCount) {
    pos.innerHTML = App.cfg.positions.map((p) => `<button data-p="${esc(p)}">${esc(p)}</button>`).join("");
    pos.onclick = (e) => { const b = e.target.closest("button"); if (!b) return; sel.position = b.dataset.p; save(); refreshForm(); };
  }
  if (!sel.position || !App.cfg.positions.includes(sel.position)) sel.position = App.cfg.positions[0];
  if (!sel.activity || !activityById(sel.activity)) sel.activity = App.cfg.activities[0].id;
  refreshForm();
}

function currentVolunteer() {
  return $("#vol").value === "__new" ? $("#vol-new").value.trim() : $("#vol").value;
}

function refreshForm() {
  const st = App.status; if (!st) return;
  const v = currentVolunteer();
  const act = activityById(sel.activity);
  $("#vol").disabled = act.no_volunteer;
  $("#vol-new").hidden = $("#vol").value !== "__new";
  [...$("#pos").children].forEach((b) => b.classList.toggle("on", b.dataset.p === sel.position));
  const counts = st.counts[v] || {}, none = st.counts["none"] || {};
  const html = App.cfg.activities.map((a) => {
    const n = (a.no_volunteer ? none : counts)[a.id] || 0;
    return `<button class="act ${a.id === sel.activity ? "on" : ""} ${n >= a.target ? "done" : ""}" data-a="${a.id}">
      <div class="n">${esc(a.name)}</div>
      <div class="c"><span class="tag ${a.label}">${a.label}</span><b>${n}/${a.target}</b></div></button>`;
  }).join("");
  if ($("#acts").dataset.html !== html) { $("#acts").innerHTML = html; $("#acts").dataset.html = html; }
  const n = (act.no_volunteer ? none : counts)[act.id] || 0, left = Math.max(1, act.target - n);
  const quick = [1, 5, 10].map((k) => `<button data-r="${k}">${k}</button>`).join("") +
    `<button data-r="${left}">ที่เหลือ ${left}</button>`;
  if ($("#quick").dataset.html !== quick) { $("#quick").innerHTML = quick; $("#quick").dataset.html = quick; }
}

$("#vol").onchange = () => {
  if ($("#vol").value !== "__new") { sel.volunteer = $("#vol").value; save(); }
  refreshForm();
  if ($("#vol").value === "__new") $("#vol-new").focus();
};
$("#vol-new").oninput = refreshForm;
$("#acts").onclick = (e) => { const b = e.target.closest(".act"); if (!b) return; sel.activity = b.dataset.a; save(); refreshForm(); };
$("#quick").onclick = (e) => { const b = e.target.closest("button"); if (b) $("#reps").value = b.dataset.r; };
$("#minus").onclick = () => { $("#reps").value = Math.max(1, (+$("#reps").value || 1) - 1); };
$("#plus").onclick = () => { $("#reps").value = Math.min(200, (+$("#reps").value || 1) + 1); };
$("#start").onclick = () => {
  const volunteer = currentVolunteer();
  if (!activityById(sel.activity).no_volunteer && !volunteer) return showErr("ใส่ชื่อผู้ทดลองก่อน");
  if ($("#vol").value === "__new") { sel.volunteer = volunteer; save(); }
  send("start", { volunteer, position: sel.position, activity: sel.activity, reps: +$("#reps").value || 1, note: $("#note").value });
};
$("#stop").onclick = () => send("stop");
$("#review").onclick = (e) => { const b = e.target.closest("button"); if (b) send(b.dataset.act); };

// ------------------------------------------------------------------ status
function onTimeline(name, tk) {
  if (name === "cue") {
    if (App.cfg.cue.vibrate && navigator.vibrate) navigator.vibrate([350, 120, 350]);
    $("#flash-t").textContent = tk.cue_text;
    $("#flash-s").textContent = tk.name;
    $("#flash").classList.add("on");
    setTimeout(() => $("#flash").classList.remove("on"), App.cfg.cue.flash_s * 1000);
  } else if (name === "end" && App.cfg.cue.vibrate && navigator.vibrate) navigator.vibrate(150);
}

function onStatus(st) {
  runTimeline(st, onTimeline);
  const L = st.link, now = serverNow(), tk = st.take;
  $("#link").querySelector(".dot").className = "dot bg-" + L.status;
  $("#link").querySelector("span:last-child").textContent =
    !L.port_ok ? "Rx ไม่ได้เชื่อมต่อ" : L.status === "none" ? "ไม่มีสัญญาณจาก Tx" :
    `${L.rate_hz} Hz · ${fmt(L.rssi)} dBm · หาย ${fmt(L.air_loss_pct, 1)}%`;
  $("#conn").textContent = "ออนไลน์";

  let title = "", big = "", sub = "";
  if (st.phase === "idle") { title = "พร้อม"; sub = "เลือกท่า แล้วกดเริ่มบันทึก"; }
  else if (st.phase === "countdown") { title = tk.name; big = Math.max(0, Math.ceil(tk.t_start - now)); sub = `เทค ${tk.rep}/${tk.reps} · ${tk.volunteer} · ${tk.position}`; }
  else if (st.phase === "recording") {
    title = tk.name;
    if (tk.cue_at && now < tk.cue_at) { big = Math.ceil(tk.cue_at - now); sub = "อยู่นิ่ง รอสัญญาณ"; }
    else if (tk.cue_at && now < tk.cue_at + 1.5) { big = tk.cue_text; sub = "ทำท่าเลย"; }
    else { big = Math.max(0, Math.ceil(tk.t_end - now)); sub = "นิ่งไว้จนจบ"; }
  } else if (st.phase === "review") { title = st.last_result.verdict === "pass" ? "ผ่าน" : "ไม่ผ่าน"; sub = "เลือกด้านล่าง"; }
  else if (st.phase === "rest") { title = "พัก"; big = Math.max(0, Math.ceil(st.phase_end - now)); sub = `ถัดไป เทค ${st.batch.done + 1}/${st.batch.reps}`; }
  $("#status").className = "panel status ph-" + st.phase;
  $("#phase").textContent = PHASE_TH[st.phase] || st.phase;
  $("#title").textContent = title;
  $("#big").textContent = big;
  $("#sub").textContent = sub;

  $("#setup").hidden = st.phase !== "idle";
  $("#running").hidden = !["countdown", "recording", "rest"].includes(st.phase);
  $("#review").hidden = st.phase !== "review";
  if (st.phase === "idle" && lastPhase !== "idle") buildForm(st);
  else if (st.phase === "idle") refreshForm();
  lastPhase = st.phase;

  const r = st.last_result, box = $("#result");
  box.hidden = !r;
  if (r) {
    const items = [...(r.reasons || []).map((x) => `<li class="s-bad">${esc(x)}</li>`), ...(r.warnings || []).map((x) => `<li class="s-warn">${esc(x)}</li>`)];
    const html = `<div style="display:flex;justify-content:space-between;align-items:baseline">
      <span class="v ${r.verdict === "pass" ? "s-ok" : "s-bad"}">${r.verdict === "pass" ? "ผ่าน" : "ไม่ผ่าน"}</span>
      <span class="chip">${{ pending: "รอตัดสิน", kept: "เก็บแล้ว", discarded: "ทิ้งแล้ว" }[r.status]}</span></div>
      <div class="muted">${esc(r.take_id)}</div>
      <div>${fmt(r.rate_hz, 1, " Hz")} · หาย ${fmt(r.air_loss_pct, 2, "%")} · RSSI ${fmt(r.rssi_median)} · เคลื่อนไหว ${r.motion_ratio === null ? "–" : "x" + r.motion_ratio}</div>
      ${items.length ? `<ul>${items.join("")}</ul>` : ""}`;
    if (box.dataset.html !== html) { box.innerHTML = html; box.dataset.html = html; }
  }
  $("#log").textContent = st.log.join("\n");
}

setInterval(() => { if (App.status && !isConnected()) $("#conn").textContent = "ขาดการเชื่อมต่อ"; }, 1000);
document.addEventListener("pointerdown", unlockAudio);

// Scanned from the QR on the computer: http://<ip>:<port>/m#pin=1234 . Keep the PIN, then drop it
// from the address bar so it is not left in the tab or the history.
(() => {
  const m = /(?:^#|&)pin=([^&]*)/.exec(location.hash);
  if (!m) return;
  try { setPin(decodeURIComponent(m[1])); } catch { /* malformed: ask for the PIN as usual */ }
  history.replaceState(null, "", location.pathname + location.search);
})();

(async () => {
  await loadConfig();
  if (App.cfg.pin_required && !getPin()) askPin();
  connect("remote", onStatus);
})();
</script>
</body>
</html>
