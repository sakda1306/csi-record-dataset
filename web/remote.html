<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>CSI Remote</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { max-width: 560px; margin: 0 auto; overflow-x: hidden; font-size: 16px; }
  main { padding: 0 12px 16px; }
  select, input { min-width: 0; }

  /* top bar: link quality, current round, connection */
  .topbar { position: sticky; top: 0; z-index: 20; display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    padding: calc(8px + env(safe-area-inset-top)) 12px 8px; background: rgba(15,17,21,.94); border-bottom: 1px solid var(--line); }
  .topbar .grow { flex: 1; }
  .topbar .chip { font-size: 13px; }

  /* status card */
  .status { text-align: center; padding: 16px 12px; margin-top: 10px; }
  .status .phase { color: var(--muted); font-size: 15px; }
  .status .title { font-size: 26px; font-weight: 800; margin: 2px 0; text-wrap: balance; }
  .status .big { font-size: 76px; font-weight: 800; line-height: 1.05; }
  .status .sub { color: var(--muted); }
  .status .desc { font-size: 18px; margin-top: 8px; }
  .status.ph-idle { text-align: left; padding: 10px 14px; }
  .status.ph-idle .title { font-size: 18px; }
  .status.ph-idle .big, .status.ph-idle .phase { display: none; }
  .status.ph-recording { box-shadow: inset 0 0 0 3px var(--bad); }
  .status.ph-countdown { box-shadow: inset 0 0 0 3px var(--warn); }

  /* setup cards */
  .card { margin-top: 10px; }
  .sec-h { display: flex; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 10px; }
  .sec-h .n { width: 26px; height: 26px; border-radius: 50%; background: var(--info); color: #0b0d10;
    display: inline-grid; place-items: center; font-size: 14px; flex: none; }
  .sec-h .muted { font-weight: 400; font-size: 14px; margin-left: auto; }
  .hint { font-size: 14px; color: var(--muted); margin-top: 8px; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
  .opt { min-height: var(--tap); background: var(--panel-2); color: var(--text); border: 2px solid var(--line);
    border-radius: 12px; padding: 6px 8px; font-weight: 600; }
  .opt.on { border-color: var(--info); background: #1d2a3a; }
  .opt small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
  .opt.full small { color: var(--ok); }
  .vols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .other { display: flex; gap: 8px; margin-top: 8px; }
  .other input { flex: 1; }

  .round { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: center;
    font-size: 14px; margin-top: 12px; }
  .round .bar { height: 10px; }
  .bl { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-top: 10px; }
  .bl button { min-height: 44px; padding: 0 12px; background: var(--warn); flex: none; }

  /* plan steps */
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .step { position: relative; width: 100%; min-height: 52px; display: flex; gap: 10px; align-items: center;
    background: var(--panel-2); color: var(--text); border: 2px solid var(--line); border-radius: 12px;
    padding: 8px 10px 10px; text-align: left; overflow: hidden; }
  .step.on { border-color: var(--info); background: #1d2a3a; }
  .step .no { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); flex: none;
    display: grid; place-items: center; font-size: 14px; font-weight: 700; }
  .step.on .no { border-color: var(--info); color: var(--info); }
  .step.done .no { background: var(--ok); border-color: var(--ok); color: #0b0d10; }
  .step .body { flex: 1; min-width: 0; }
  .step .n { font-weight: 700; display: block; overflow-wrap: anywhere; }
  .step .d { display: none; font-size: 14px; color: var(--muted); margin-top: 4px; }
  .step.on .d { display: block; }
  .step .cnt { font-weight: 700; white-space: nowrap; }
  .step.done { color: var(--muted); }
  .step.done .cnt { color: var(--ok); }
  .step .pg { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--info); }
  .step.done .pg { background: var(--ok); }
  .brk { font-size: 13px; color: var(--muted); text-align: center; padding: 2px 0; }
  .xtra-h { font-size: 13px; font-weight: 700; color: var(--muted); padding: 10px 2px 2px; border-top: 1px dashed var(--line); margin-top: 6px; }

  details.card > summary { cursor: pointer; color: var(--muted); min-height: 32px; display: flex; align-items: center; }
  details.card input { width: 100%; margin-top: 8px; }
  .log { font-family: Consolas, Menlo, monospace; font-size: 12px; color: var(--muted); white-space: pre-wrap; max-height: 160px; overflow: auto; margin-top: 8px; }

  .res .v { font-size: 22px; font-weight: 800; }
  .res ul { margin: 6px 0 0; padding-left: 18px; }
  .res .kv { font-size: 14px; color: var(--muted); }

  /* bottom dock: the action for the current phase, always within thumb reach */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(15,17,21,.97);
    border-top: 1px solid var(--line); padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
  .dock > div { max-width: 536px; margin: 0 auto; }
  .reps { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .reps .lab { font-size: 14px; color: var(--muted); margin-right: auto; }
  .reps button { min-width: var(--tap); min-height: var(--tap); padding: 0 10px; }
  .reps input { width: 64px; text-align: center; font-size: 20px; }
  .go { width: 100%; min-height: 60px; font-size: 20px; font-weight: 800; padding: 8px 12px; }
  .go small { display: block; font-size: 14px; font-weight: 600; }
  .review { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .review .btn-ok { grid-column: 1 / -1; }
  .review button { min-height: 54px; font-size: 18px; font-weight: 700; }

  .flash .t { font-size: 34vw; line-height: 1; } .flash .s { font-size: 7vw; }
</style>
</head>
<body>
<header class="topbar">
  <span class="chip" id="link"><span class="dot"></span><span>–</span></span>
  <span class="chip" id="round-chip" hidden></span>
  <span class="grow"></span>
  <span class="chip" id="conn">กำลังเชื่อมต่อ…</span>
</header>

<main>
  <div class="panel status ph-idle" id="status" role="status" aria-live="polite">
    <div class="phase" id="phase">–</div>
    <div class="title" id="title">–</div>
    <div class="big num" id="big"></div>
    <div class="sub" id="sub"></div>
    <div class="desc" id="desc"></div>
  </div>
  <div class="err" id="err" role="alert" style="margin-top:6px"></div>

  <section class="panel res" id="result" hidden></section>

  <!-- idle: choose room, volunteer and a step of the plan -->
  <section id="setup" hidden>
    <div class="panel card">
      <div class="sec-h"><span class="n">1</span>ห้องน้ำ</div>
      <div class="seg" id="room"></div>
      <div class="hint" id="room-use"></div>
    </div>

    <div class="panel card">
      <div class="sec-h"><span class="n">2</span>อาสาสมัคร <span class="muted">ใช้รหัสแทนชื่อ</span></div>
      <div class="vols" id="vols"></div>
      <div class="other" id="other" hidden>
        <input id="vol-new" list="vol-list" placeholder="รหัส เช่น p08" autocomplete="off" aria-label="รหัสอาสาสมัคร">
        <datalist id="vol-list"></datalist>
      </div>
      <div class="round" id="sum"></div>
      <div class="warnbox bl" id="bl-warn" hidden>
        <span>ยังไม่มี baseline (ห้องว่าง) ของรอบนี้</span>
        <button id="go-bl">ไปขั้นห้องว่าง</button>
      </div>
    </div>

    <div class="panel card">
      <div class="sec-h"><span class="n">3</span>ขั้นในแผน <span class="muted">แตะเพื่อเลือก</span></div>
      <ol class="steps" id="steps"></ol>
    </div>

    <details class="panel card">
      <summary>หมายเหตุ (ไม่ใส่ก็ได้)</summary>
      <input id="note" maxlength="200" placeholder="เช่น ใส่รองเท้าแตะ, พื้นเปียก" aria-label="หมายเหตุ">
    </details>
  </section>

  <details class="panel card">
    <summary>บันทึกการทำงาน</summary>
    <div class="log" id="log"></div>
  </details>
</main>

<footer class="dock" id="dock">
  <div id="dock-setup" hidden>
    <div class="reps">
      <span class="lab">จำนวนครั้งต่อกัน</span>
      <button class="btn-ghost" id="minus" aria-label="ลดจำนวนครั้ง">−</button>
      <input id="reps" class="num" type="number" min="1" max="200" value="1" inputmode="numeric" aria-label="จำนวนครั้ง">
      <button class="btn-ghost" id="plus" aria-label="เพิ่มจำนวนครั้ง">+</button>
      <button class="btn-ghost" id="left-btn" hidden></button>
    </div>
    <button class="go btn-ok" id="start">เริ่มบันทึก</button>
  </div>
  <div id="dock-running" hidden>
    <button class="go btn-bad" id="stop">หยุด<small>ครั้งที่กำลังบันทึกจะไม่ถูกเก็บ</small></button>
  </div>
  <div id="dock-review" hidden>
    <div class="review" id="review">
      <button class="btn-ok" data-act="keep">เก็บครั้งนี้</button>
      <button class="btn-warn" data-act="redo">ทิ้ง แล้วบันทึกใหม่</button>
      <button class="btn-bad" data-act="discard">ทิ้ง แล้วหยุด</button>
    </div>
  </div>
</footer>

<div class="flash" id="flash"><div class="t" id="flash-t"></div><div class="s" id="flash-s"></div></div>
<div class="overlay" id="pin-box" hidden>
  <div class="panel" style="width:min(360px,100%)">
    <label for="pin" style="display:block;font-size:20px;font-weight:700;margin-bottom:10px">ใส่ PIN</label>
    <input id="pin" inputmode="numeric" autocomplete="off" style="width:100%;font-size:24px;text-align:center">
    <div class="err" id="pin-err"></div>
    <button class="go btn-ok" id="pin-ok" style="margin-top:6px">ตกลง</button>
  </div>
</div>

<script src="/common.js"></script>
<script>
"use strict";
const sel = load() || {};
let lastPhase = null;
let otherMode = false;  // typing a volunteer code that is not in the room's list

function load() { try { return JSON.parse(localStorage.getItem("csirec.sel")); } catch { return null; } }
function save() { try { localStorage.setItem("csirec.sel", JSON.stringify(sel)); } catch { /* private mode */ } }
function setHtml(el, html) { if (el.dataset.html !== html) { el.innerHTML = html; el.dataset.html = html; } }

function showErr(msg) {
  $("#err").textContent = msg || "";
  if (msg) setTimeout(() => { if ($("#err").textContent === msg) $("#err").textContent = ""; }, 5000);
}

async function send(action, args, btn) {
  unlockAudio();
  if (btn) btn.disabled = true;  // feedback while the command is on its way
  try { await api(action, args); showErr(""); }
  catch (e) {
    if (e.status === 403) { askPin(e.message); return; }
    showErr(e.message);
  } finally { if (btn) btn.disabled = false; }
}

function askPin(msg) {
  $("#pin-err").textContent = msg || "";
  $("#pin").value = getPin();
  $("#pin-box").hidden = false;
  $("#pin").focus();
}
$("#pin-ok").onclick = () => { setPin($("#pin").value.trim()); $("#pin-box").hidden = true; unlockAudio(); };
$("#pin").onkeydown = (e) => { if (e.key === "Enter") $("#pin-ok").click(); };

// ------------------------------------------------------------------ plan helpers
const room = () => roomById(sel.room);
function roundLeft(c) { return App.cfg.steps.filter((s) => !s.extra).reduce((n, s) => n + stepLeft(s, c), 0); }
function nextVolunteer(st, r) {
  return r.volunteers.find((v) => roundLeft(roundCounts(st, r.id, v)) > 0) || r.volunteers[0] || "";
}
function nextStep(c) {
  const i = App.cfg.steps.findIndex((s) => !stepHidden(s) && stepLeft(s, c) > 0);
  if (i >= 0) return i;
  const shown = App.cfg.steps.map((s, k) => (stepHidden(s) ? -1 : k)).filter((k) => k >= 0);
  return shown.length ? shown[shown.length - 1] : 0;
}
function currentVolunteer() { return otherMode ? $("#vol-new").value.trim() : sel.volunteer || ""; }
function counts() { return roundCounts(App.status, sel.room, currentVolunteer()); }
function pickStep(i) {
  sel.step = i; save();
  const s = App.cfg.steps[i], left = stepLeft(s, counts());
  $("#reps").value = left || s.reps;
}

// ------------------------------------------------------------------ setup form
// on returning to idle: keep the round, move on to the next step with takes left
function buildForm(st) {
  if (!room() || room().hidden) sel.room = visibleRooms()[0].id;
  if (!sel.volunteer) sel.volunteer = nextVolunteer(st, room());
  otherMode = !room().volunteers.includes(sel.volunteer);
  if (otherMode) $("#vol-new").value = sel.volunteer;
  const cur = App.cfg.steps[sel.step];
  pickStep(!cur || stepHidden(cur) || stepLeft(cur, counts()) === 0 ? nextStep(counts()) : sel.step);  // also refills the count
  refreshForm();
}

function refreshForm() {
  const st = App.status; if (!st) return;
  const r = room();

  setHtml($("#room"), visibleRooms().map((x) =>
    `<button class="opt ${x.id === sel.room ? "on" : ""}" data-r="${esc(x.id)}" aria-pressed="${x.id === sel.room}">
      ${esc(x.name)}<small>${x.extra ? "นอกแผน" : x.test_only ? "ทดสอบเท่านั้น" : "ฝึก / ทดสอบ"}</small></button>`).join(""));
  $("#room-use").innerHTML = `${esc(r.use)}${r.test_only ? ' · <span class="tag test">ห้ามใช้ฝึก</span>' : ""}` +
    (r.extra ? ' · <span class="tag none">นอกแผน: ไม่นับรวมเป้า 65/780</span>' : "");

  const T0 = roundTotals({}).all[1];
  setHtml($("#vols"), r.volunteers.map((v) => {
    const n = roundTotals(roundCounts(st, r.id, v)).all[0], on = !otherMode && v === sel.volunteer;
    return `<button class="opt ${on ? "on" : ""} ${n >= T0 ? "full" : ""}" data-v="${esc(v)}" aria-pressed="${on}">
      ${esc(v)}<small class="num">${n}/${T0}</small></button>`;
  }).join("") + `<button class="opt ${otherMode ? "on" : ""}" data-v="__other" aria-pressed="${otherMode}">อื่นๆ<small>พิมพ์รหัส</small></button>`);
  $("#other").hidden = !otherMode;
  setHtml($("#vol-list"), st.volunteers.filter((v) => !r.volunteers.includes(v)).map((v) => `<option value="${esc(v)}">`).join(""));

  const v = currentVolunteer(), c = counts(), T = roundTotals(c);
  const row = (lab, [n, t], cls) => `<span>${lab}</span><div class="bar ${n >= t ? "done" : cls}"><i style="width:${t ? n / t * 100 : 0}%"></i></div><b class="num">${n}/${t}</b>`;
  $("#sum").innerHTML = v ? row(`รอบ ${esc(r.id.toUpperCase())} · ${esc(v)}`, T.all, "") + row("ล้ม", T.fall, "fall") + row("ปกติ", T.normal, "") : "";
  $("#bl-warn").hidden = !v || hasBaseline(st, r.id, v);

  let firstExtra = true;
  setHtml($("#steps"), App.cfg.steps.map((s, i) => {  // i stays the index in cfg.steps
    if (stepHidden(s)) return "";
    const left = stepLeft(s, c), done = s.reps - left, on = i === sel.step;
    const head = s.extra && firstExtra ? '<li class="xtra-h">นอกแผน (ไม่นับรวมเป้า)</li>' : "";
    if (s.extra) firstExtra = false;
    return `${head}<li><button class="step ${on ? "on" : ""} ${left === 0 ? "done" : ""}" data-s="${i}" aria-pressed="${on}">
      <span class="no">${left === 0 ? CHECK_SVG : i + 1}</span>
      <span class="body"><span class="n">${esc(s.name)}</span>
        <span class="d"><span class="tag ${stepTag(s)[0]}">${stepTag(s)[1]}</span> ${esc(stepDesc(s))}</span></span>
      <span class="cnt num">${done}/${s.reps}</span>
      <i class="pg" style="width:${done / s.reps * 100}%"></i></button></li>` +
      (s.break_min ? `<li class="brk">พัก ${s.break_min} นาที</li>` : "");
  }).join(""));

  const s = App.cfg.steps[sel.step], left = s ? stepLeft(s, c) : 0;
  $("#left-btn").hidden = !left || +$("#reps").value === left;
  $("#left-btn").textContent = `ที่เหลือ ${left}`;
  $("#left-btn").dataset.r = left;
  const n = +$("#reps").value || 1;
  $("#start").innerHTML = s ? `เริ่ม · ${esc(s.name)}<small>${esc(r.id.toUpperCase())} · ${esc(v || "ยังไม่เลือกอาสาสมัคร")} · ${n} ครั้ง</small>` : "เริ่มบันทึก";
}

$("#room").onclick = (e) => {
  const b = e.target.closest("button"); if (!b || b.dataset.r === sel.room) return;
  sel.room = b.dataset.r;
  if (!room().volunteers.includes(sel.volunteer)) { sel.volunteer = nextVolunteer(App.status, room()); otherMode = false; }
  pickStep(nextStep(counts()));
  refreshForm();
};
$("#vols").onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.v === "__other") { otherMode = true; refreshForm(); $("#vol-new").focus(); return; }
  otherMode = false; sel.volunteer = b.dataset.v;
  pickStep(nextStep(counts()));
  refreshForm();
};
$("#vol-new").oninput = refreshForm;
$("#go-bl").onclick = () => {
  const i = App.cfg.steps.findIndex((s) => s.acts.some((a) => activityById(a).no_volunteer));
  if (i >= 0) { pickStep(i); refreshForm(); }
};
$("#steps").onclick = (e) => { const b = e.target.closest(".step"); if (!b) return; pickStep(+b.dataset.s); refreshForm(); };
$("#left-btn").onclick = () => { $("#reps").value = $("#left-btn").dataset.r; refreshForm(); };
$("#minus").onclick = () => { $("#reps").value = Math.max(1, (+$("#reps").value || 1) - 1); refreshForm(); };
$("#plus").onclick = () => { $("#reps").value = Math.min(200, (+$("#reps").value || 1) + 1); refreshForm(); };
$("#reps").oninput = refreshForm;
$("#start").onclick = () => {
  const volunteer = currentVolunteer();
  if (!volunteer) { showErr("เลือกหรือพิมพ์รหัสอาสาสมัครก่อน"); return; }
  if (otherMode) { sel.volunteer = volunteer; save(); }
  send("start", { room: sel.room, volunteer, step: sel.step, reps: +$("#reps").value || 1, note: $("#note").value }, $("#start"));
};
$("#stop").onclick = () => send("stop", {}, $("#stop"));
$("#review").onclick = (e) => { const b = e.target.closest("button"); if (b) send(b.dataset.act, {}, b); };

// ------------------------------------------------------------------ status
function onTimeline(name, tk) {
  if (name === "cue") {
    if (App.cfg.cue.vibrate && navigator.vibrate) navigator.vibrate([350, 120, 350]);
    $("#flash-t").textContent = tk.cue_text;
    $("#flash-s").textContent = tk.name;
    $("#flash").classList.add("on");
    setTimeout(() => $("#flash").classList.remove("on"), App.cfg.cue.flash_s * 1000);
  } else if (name === "end" && App.cfg.cue.vibrate && navigator.vibrate) navigator.vibrate(150);
}

function onStatus(st) {
  runTimeline(st, onTimeline);
  const L = st.link, now = serverNow(), tk = st.take;
  $("#link").querySelector(".dot").className = "dot bg-" + L.status;
  $("#link").querySelector("span:last-child").textContent =
    !L.port_ok ? "Rx ไม่ได้เชื่อมต่อ" : L.status === "none" ? "ไม่มีสัญญาณจาก Tx" :
    `${L.rate_hz} Hz · หาย ${fmt(L.air_loss_pct, 0)}%`;
  $("#conn").textContent = "ออนไลน์";
  const rd = st.batch || (st.phase === "idle" ? null : st.round);
  $("#round-chip").hidden = !rd;
  if (rd) $("#round-chip").textContent = `ห้อง ${rd.room.toUpperCase()} · ${rd.volunteer}`;

  let title = "", big = "", sub = "", desc = "";
  const where = tk ? `ครั้ง ${tk.rep}/${tk.reps} · ห้อง ${tk.room.toUpperCase()} · ${tk.volunteer}` : "";
  if (st.phase === "idle") { title = "พร้อม — เลือก 1 ห้อง 2 อาสาสมัคร 3 ขั้น แล้วกดเริ่ม"; }
  else if (st.phase === "countdown") { title = tk.name; big = Math.max(0, Math.ceil(tk.t_start - now)); sub = where; desc = tk.desc; }
  else if (st.phase === "recording") {
    title = tk.name;
    if (tk.cue_at && now < tk.cue_at) { big = Math.ceil(tk.cue_at - now); sub = "ยืนนิ่ง รอสัญญาณ"; desc = tk.desc; }
    else if (tk.cue_at && now < tk.cue_at + 1.5) { big = tk.cue_text; sub = "ทำท่าเลย"; }
    else { big = Math.max(0, Math.ceil(tk.t_end - now)); sub = tk.cue_at ? "ค้างท่าสุดท้ายไว้จนจบ" : where; }
  } else if (st.phase === "review") {
    const r = st.last_result;
    title = r.verdict !== "pass" ? "ไม่ผ่าน" : r.warnings?.length ? "ผ่าน (มีคำเตือน)" : "ผ่าน";
    sub = "เลือกด้านล่าง — ไม่ผ่านให้บันทึกใหม่";
  } else if (st.phase === "rest") {
    title = "พัก กลับสู่ท่าเริ่มต้น"; big = Math.max(0, Math.ceil(st.phase_end - now));
    sub = `ถัดไป ${st.batch.step_name} ครั้ง ${st.batch.done + 1}/${st.batch.reps}`;
  }
  $("#status").className = "panel status ph-" + st.phase;
  $("#phase").textContent = PHASE_TH[st.phase] || st.phase;
  $("#title").textContent = title;
  $("#big").textContent = big;
  $("#sub").textContent = sub;
  $("#desc").textContent = desc;

  const running = ["countdown", "recording", "rest"].includes(st.phase);
  $("#setup").hidden = st.phase !== "idle";
  $("#dock-setup").hidden = st.phase !== "idle";
  $("#dock-running").hidden = !running;
  $("#dock-review").hidden = st.phase !== "review";
  if (st.phase === "idle" && lastPhase !== "idle") buildForm(st);
  else if (st.phase === "idle") refreshForm();
  lastPhase = st.phase;

  const r = st.last_result, box = $("#result");
  box.hidden = !r || st.phase === "idle" && r.status !== "pending" && Date.now() / 1000 - (App.idleSince || 0) > 30;
  if (r) {
    const items = [...(r.reasons || []).map((x) => `<li class="s-bad">${esc(x)}</li>`), ...(r.warnings || []).map((x) => `<li class="s-warn">${esc(x)}</li>`)];
    const html = `<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
      <span class="v ${r.verdict === "pass" ? "s-ok" : "s-bad"}">ล่าสุด: ${r.verdict === "pass" ? "ผ่าน" : "ไม่ผ่าน"}</span>
      <span class="chip">${{ pending: "รอตัดสิน", kept: "เก็บแล้ว", discarded: "ทิ้งแล้ว" }[r.status]}</span></div>
      <div class="muted">${esc(r.take_id)}</div>
      <div class="kv num">${r.frames}/${r.frames_expected} ตัวอย่าง · หาย ${fmt(r.air_loss_pct, 1, "%")} · RSSI ${fmt(r.rssi_median)}
      ${r.action_start_s !== null && r.action_start_s !== undefined ? ` · ท่า ${fmt(r.action_start_s, 1)}–${fmt(r.action_end_s, 1)} s` : ""}</div>
      ${items.length ? `<ul>${items.join("")}</ul>` : ""}`;
    setHtml(box, html);
  }
  $("#log").textContent = st.log.join("\n");
}

// keep the content clear of the fixed dock
new ResizeObserver(() => { document.body.style.paddingBottom = $("#dock").offsetHeight + 12 + "px"; }).observe($("#dock"));
setInterval(() => {
  if (App.status && !isConnected()) $("#conn").textContent = "ขาดการเชื่อมต่อ";
  if (App.status?.phase !== "idle") App.idleSince = Date.now() / 1000;
}, 1000);
document.addEventListener("pointerdown", unlockAudio);

// Scanned from the QR on the computer: http://<ip>:<port>/m#pin=1234 . Keep the PIN, then drop it
// from the address bar so it is not left in the tab or the history.
(() => {
  const m = /(?:^#|&)pin=([^&]*)/.exec(location.hash);
  if (!m) return;
  try { setPin(decodeURIComponent(m[1])); } catch { /* malformed: ask for the PIN as usual */ }
  history.replaceState(null, "", location.pathname + location.search);
})();

(async () => {
  await loadConfig();
  if (App.cfg.pin_required && !getPin()) askPin();
  App.onPlan = () => { if (App.status && App.status.phase === "idle") buildForm(App.status); };
  connect("remote", onStatus);
})();
</script>
</body>
</html>
