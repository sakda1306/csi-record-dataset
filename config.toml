# ค่าตั้งของระบบบันทึก dataset — แก้ไฟล์นี้แล้วรัน record.py ใหม่
# รูปแบบ TOML: ข้อความต้องอยู่ใน "..." , true/false ตัวเล็ก , # คือคอมเมนต์
# ค่าแผนการเก็บ (ห้อง อาสาสมัคร ท่า จำนวน เวลา) มาจาก "แผนเก็บข้อมูลเพื่อการตรวจจับการล้มข้ามห้องน้ำ"
# (docs/data-collection/Data_Strategy_3_Bathrooms.pdf) — เลข § ในคอมเมนต์คือหัวข้อในเอกสารนั้น

# ---------------------------------------------------------------- บอร์ด Rx
[serial]
# พอร์ตของบอร์ด Rx
#   "auto"                     = หาเองจากบอร์ดที่ส่งข้อมูล CSI อยู่ (แนะนำ)
#   Windows ตัวอย่าง           = "COM10"
#   macOS ตัวอย่าง             = "/dev/cu.usbserial-0001" หรือ "/dev/cu.usbmodem1101"
#   ดูรายชื่อพอร์ต: python record.py --list-ports
rx_port = "auto"
baud = 921600
rate_hz = 100            # อัตราที่ Tx ส่ง ping (ต้องตรงกับ firmware) — 10 s = 1,000 ตัวอย่าง

# ---------------------------------------------------------------- เว็บ (จอคอม + รีโมตมือถือ)
[server]
host = "0.0.0.0"         # "0.0.0.0" = มือถือในวง Wi-Fi เดียวกันเข้าได้, "127.0.0.1" = เฉพาะเครื่องนี้
port = 8765
pin = "1234"             # รหัสที่มือถือต้องใส่ก่อนสั่งงาน ("" = ไม่ต้องใส่)
open_browser = true      # เปิดหน้าจอแสดงผลบนคอมให้อัตโนมัติ

# ---------------------------------------------------------------- ที่เก็บไฟล์ (§9)
[storage]
# โฟลเดอร์เก็บ dataset (ถ้ายังไม่มี โปรแกรมสร้างให้เอง) — ห้ามอัปโหลดข้อมูลขึ้น GitHub
#   "data"                          = โฟลเดอร์ data ข้างไฟล์ config นี้
#   "D:/Dataset/CSI"                = Windows: ใช้ / แทน \ ได้
#   'D:\Dataset\CSI'                = Windows: ถ้าจะใช้ \ ต้องใช้เครื่องหมาย ' (ไม่ใช่ ")
#   "~/Documents/CSI-dataset"       = macOS: ~ คือโฟลเดอร์ของผู้ใช้
#   "G:/My Drive/Final-Project/dataset" = โฟลเดอร์ Google Drive ที่ sync ไว้ (สำรองให้ทุกวันอัตโนมัติ)
data_dir = "G:/My Drive/Final-Project/dataset"
session = "auto"         # ชื่อรอบเก็บข้อมูล, "auto" = วันที่วันนี้ เช่น 2026-12-22
location = "bathroom"    # สถานที่ บันทึกลงทุกไฟล์ (ห้อง A/B/C เลือกจากมือถือ)
write_csv = true         # เขียน CSV amplitude แบบเดียวกับไฟล์ exp7/exp8 เดิมด้วย
keep_discarded = true    # true = ย้ายเทคที่ทิ้งไปไว้ที่ _discarded/ (ไม่ลบจริง)

# ---------------------------------------------------------------- จังหวะเวลา (§6, ค่าเริ่มต้นของทุกท่า แต่ละท่าแก้ทับได้)
# 1 ครั้ง = 10 วินาที:  0-3 s ยืนนิ่ง | 3 s สัญญาณเสียง แล้วทำท่า | 6-10 s ค้างท่าสุดท้าย
[timing]
countdown_s = 5          # นับถอยหลังก่อนเริ่มบันทึก (ให้เวลาเข้าที่)
duration_s = 10          # ความยาวการบันทึกต่อครั้ง
cue_s = 3                # วินาทีที่ให้สัญญาณเสียงทำท่า นับจากเริ่มบันทึก
rest_s = 15              # พักระหว่างครั้ง (+ นับถอยหลัง 5 = เว้นประมาณ 20 วินาที กลับสู่ท่าเริ่มต้น)

# ---------------------------------------------------------------- เกณฑ์คุณภาพต่อครั้ง (§6 "ตรวจทันที")
[quality]
min_rate_hz = 80         # ประมาณ 1,000 ตัวอย่าง หายไม่เกิน 20 % = อย่างน้อย 800 ตัวอย่างใน 10 s
max_air_loss_pct = 20    # เฟรมหายในอากาศเกินนี้ = ไม่ผ่าน
max_gap_ms = 200         # มีช่องว่างระหว่างเฟรมนานกว่านี้แม้ครั้งเดียว = ไม่ผ่าน (ท่าอาจหายไปทั้งท่า)
min_motion_ratio = 2.0   # ท่าที่ต้องขยับ: การเคลื่อนไหวหลังสัญญาณต้องมากกว่าก่อนสัญญาณกี่เท่า (ต่ำกว่า = เตือน)
auto_keep_pass = true    # true = ครั้งที่ผ่านเก็บเลย, ครั้งที่ไม่ผ่านรอให้กด เก็บ/บันทึกใหม่
                         # false = ทุกครั้งรอให้กดเอง
review_warnings = true   # true = ครั้งที่ผ่านแต่มีคำเตือน (เช่น ขยับก่อนสัญญาณ, ท่ายังไม่จบตอนหยุดบันทึก)
                         #        รอให้ดูก่อน แล้วกด เก็บ หรือ บันทึกใหม่ในรอบเดียวกัน

# ---------------------------------------------------------------- สัญญาณบอกจังหวะ
[cue]
sound = true             # เสียงบี๊บ (นับถอยหลัง, เริ่ม, ทำท่า, จบ)
speech = true            # พูดชื่อท่าตอนเริ่มนับถอยหลัง (ถ้าเบราว์เซอร์มีเสียงภาษาไทย)
vibrate = true           # มือถือสั่นตอนให้ทำท่า (Android)
flash_s = 1.5            # จอกะพริบแดงนานกี่วินาทีตอนให้ทำท่า

# ---------------------------------------------------------------- หน้าจอ
[display]
window_s = 10            # กราฟย้อนหลังกี่วินาที

# ---------------------------------------------------------------- ห้องน้ำและอาสาสมัคร (§2, §4)
# id          ใช้ตั้งชื่อไฟล์ เช่น a_p01_fall_01.bin (a-z 0-9 _)
# volunteers  รหัสอาสาสมัครของห้องนี้ (ใช้รหัสแทนชื่อ) เพิ่มรหัสใหม่จากมือถือได้ด้วย
# setup       จดขนาดห้องและระยะติดตั้งจริงไว้ที่นี่ บันทึกลงทุกไฟล์ของห้องนั้น
# test_only   true = ห้องทดสอบข้ามห้อง ห้ามใช้ฝึก
[[rooms]]
id = "a"
name = "ห้องน้ำ A"
volunteers = ["p01", "p02", "p03", "p04", "p05"]
use = "ฝึก ตรวจสอบ และทดสอบ"
setup = ""               # เช่น "กว้าง 1.80 ยาว 1.60 สูง 2.50 ม. · Tx-Rx 1.75 ม. สูง 1.00 ม. · ผนังกระเบื้อง"

[[rooms]]
id = "b"
name = "ห้องน้ำ B"
volunteers = ["p01", "p02", "p03", "p04", "p05"]
use = "ฝึก ตรวจสอบ และทดสอบ"
setup = ""

[[rooms]]
id = "c"
name = "ห้องน้ำ C"
volunteers = ["p06", "p07"]
use = "ทดสอบข้ามห้องเท่านั้น ห้ามใช้ฝึก"
setup = ""
test_only = true

# ---------------------------------------------------------------- ท่าที่ต้องทำ (§5)
# id       ใช้ตั้งชื่อไฟล์และคอลัมน์ action ใน labels.csv (a-z 0-9 _)
# name     ชื่อที่แสดงบนจอ / พูด
# desc     วิธีทำท่า แสดงบนจอคอมและมือถือ
# label    คลาสสำหรับโมเดล: "fall", "normal" หรือ "none" (ห้องว่าง ไม่ใช่คลาส)
# cue_text ข้อความใหญ่บนจอตอนให้ทำท่า
# expect_motion  ท่านี้ต้องมีการเคลื่อนไหวหลังสัญญาณไหม (ใช้เช็กว่าทำท่าทันจังหวะ)
# ends_still     true = จบท่าแล้วค้างนิ่ง ถ้ายังขยับอยู่ตอนหยุดบันทึกจะเตือนว่าท่าอาจไม่ครบ
# no_volunteer   true = ห้องว่าง ไม่มีคนในห้อง
# train          false = ไม่นำไปฝึก (เช่น เคลื่อนไหวอิสระ ใช้วัดการแจ้งเตือนผิดต่อชั่วโมง)
# แก้ทับ countdown_s / duration_s / cue_s / rest_s ได้รายท่า ; cue_s = 0 คือไม่มีสัญญาณทำท่า
# จำนวนครั้งของแต่ละท่ามาจาก [[steps]] ด้านล่าง

[[activities]]
id = "baseline"
name = "ห้องว่าง (baseline)"
desc = "วางเบาะแล้ว ทุกคนออกจากห้อง ปิดประตู"
label = "none"
duration_s = 60
countdown_s = 15
cue_s = 0
expect_motion = false
no_volunteer = true

[[activities]]
id = "fall"
name = "ล้มไปข้างหน้า"
desc = "ลงเข่าก่อน ตามด้วยมือ ลงบนเบาะ แล้วนอนนิ่ง"
label = "fall"
cue_text = "ล้ม!"

[[activities]]
id = "sit_stand"
name = "นั่งลงแล้วลุกขึ้น"
desc = "นั่งบนเก้าอี้ที่มั่นคง แล้วลุกขึ้น"
label = "normal"
cue_text = "นั่ง-ลุก!"

[[activities]]
id = "pick_up"
name = "ก้มเก็บของ"
desc = "ก้มเก็บของจากพื้น แล้วยืดตัวขึ้น"
label = "normal"
cue_text = "ก้ม!"

[[activities]]
id = "walk_stop"
name = "เดินแล้วหยุดยืน"
desc = "เดินในห้อง แล้วหยุดยืนนิ่ง"
label = "normal"
cue_text = "เดิน!"

[[activities]]
id = "slow_sit"
name = "ค่อยๆ นั่งลงพื้น"
desc = "ลงสู่พื้นอย่างช้าๆ และตั้งใจ แล้วนั่งนิ่ง"
label = "normal"
cue_text = "ค่อยๆ นั่ง"

[[activities]]
id = "slow_lie"
name = "ค่อยๆ นอนลงพื้น"
desc = "ลงสู่พื้นอย่างช้าๆ และตั้งใจ แล้วนอนนิ่ง"
label = "normal"
cue_text = "ค่อยๆ นอน"

[[activities]]
id = "shower"
name = "ท่าคล้ายอาบน้ำ"
desc = "ยกแขนถูตัวและสระผม ทำแบบแห้ง (ใช้น้ำได้เมื่อได้รับอนุญาตและมีอุปกรณ์ปลอดภัย)"
label = "normal"
cue_text = "ถูตัว!"
ends_still = false       # ถูตัวต่อเนื่องจนจบ ไม่ต้องค้างนิ่ง

[[activities]]
id = "free_move"
name = "เคลื่อนไหวอิสระ (ไม่ล้ม)"
desc = "ทำกิจกรรมในห้องน้ำได้อิสระ ห้ามล้ม — ไม่นำไปฝึก ใช้วัดการแจ้งเตือนผิดต่อชั่วโมง"
label = "normal"
train = false
duration_s = 120         # ครั้งละ 2 นาที x 10 = 20 นาที (ถ้าสัญญาณสะดุด เสียแค่ 2 นาที)
countdown_s = 3
rest_s = 0
cue_s = 0
expect_motion = false

# ---------------------------------------------------------------- ลำดับใน 1 รอบ (§7) = ห้อง 1 ห้อง + อาสาสมัคร 1 คน
# รอบละ 65 ครั้ง: ล้ม 20 + ปกติ 45 (นอกจากนี้มี baseline 1 ครั้ง และเคลื่อนไหวอิสระ 20 นาที)
# activity   id ของท่า หรือรายชื่อท่าที่ทำสลับกัน เช่น ["slow_sit", "slow_lie"]
# reps       จำนวนครั้งในขั้นนี้ (ถ้ามีหลายท่า แบ่งเท่าๆ กันและสลับกัน)
# break_min  พักหลังขั้นนี้กี่นาที (แสดงในแผนเท่านั้น)
[[steps]]
activity = "baseline"
reps = 1

[[steps]]
activity = "fall"
reps = 10
name = "ล้มไปข้างหน้า ชุดที่ 1"
break_min = 3

[[steps]]
activity = "sit_stand"
reps = 10

[[steps]]
activity = "pick_up"
reps = 10
break_min = 3

[[steps]]
activity = "fall"
reps = 10
name = "ล้มไปข้างหน้า ชุดที่ 2"
break_min = 3

[[steps]]
activity = "walk_stop"
reps = 10

[[steps]]
activity = ["slow_sit", "slow_lie"]
reps = 10
name = "ค่อยๆ นั่งหรือนอนลง (สลับนั่ง 5 นอน 5)"

[[steps]]
activity = "shower"
reps = 5

[[steps]]
activity = "free_move"
reps = 10
name = "เคลื่อนไหวอิสระ 20 นาที"
