[project]
name = "csi-record-dataset"
version = "0.1.0"
description = "Records the CSI dataset with a phone remote and a live monitor"
requires-python = ">=3.11"
dependencies = [
  "pyserial==3.5",
  "numpy==2.4.6",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.16.9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF003"]  # Thai text in strings and comments
